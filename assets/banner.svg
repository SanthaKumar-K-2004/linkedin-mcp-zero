<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b101d" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Subtle Premium Radial Glows -->
    <radialGradient id="topGlow" cx="20%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#0A66C2" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#0A66C2" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cardGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0c1220" stop-opacity="0.9" />
    </linearGradient>

    <!-- Text Gradient for Title -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Subtle Dot Grid Pattern (Clean & Minimalist) -->
    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="0.8" fill="#334155" fill-opacity="0.45" />
    </pattern>

    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes subtleShine {
        0% { opacity: 0.3; }
        50% { opacity: 0.65; }
        100% { opacity: 0.3; }
      }
      .live-dot {
        animation: pulseDot 3s infinite ease-in-out;
        transform-origin: center;
      }
      .subtle-border {
        animation: subtleShine 6s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Background Pattern -->
  <rect width="1200" height="320" rx="16" fill="url(#dotGrid)" />

  <!-- Atmospheric Lighting -->
  <rect width="1200" height="320" rx="16" fill="url(#topGlow)" />

  <!-- Subtle Top Accent Line -->
  <line x1="40" y1="1" x2="500" y2="1" stroke="#0A66C2" stroke-width="2" stroke-linecap="round" class="subtle-border" opacity="0.6" />

  <!-- ================= LEFT COLUMN: BRAND & INFORMATION ================= -->
  <g transform="translate(64, 48)">

    <!-- Row 1: Brand Icon & System Status Pill -->
    <g transform="translate(0, 0)">
      <!-- Official LinkedIn Blue Badge -->
      <rect x="0" y="0" width="36" height="36" rx="8" fill="#0A66C2" />
      <text x="18" y="25" fill="#FFFFFF" font-size="20" font-weight="800" text-anchor="middle" class="font-sans">in</text>
      
      <!-- MCP Connection Badge -->
      <g transform="translate(48, 4)">
        <rect x="0" y="0" width="220" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <circle cx="16" cy="14" r="4" fill="#10B981" class="live-dot" />
        <text x="28" y="18" fill="#94A3B8" font-size="11" font-weight="600" letter-spacing="0.6" class="font-mono">FASTMCP 2.0 · PRODUCTION</text>
      </g>
    </g>

    <!-- Row 2: Main Heading -->
    <text x="0" y="86" fill="url(#titleGrad)" font-size="38" font-weight="800" letter-spacing="-0.8" class="font-sans">
      LinkedIn MCP Zero
    </text>

    <!-- Row 3: Product Subtitle -->
    <text x="0" y="122" fill="#94A3B8" font-size="15" font-weight="400" class="font-sans">
      High-performance Model Context Protocol server for real-time talent intelligence.
    </text>
    <text x="0" y="144" fill="#64748B" font-size="14" font-weight="400" class="font-sans">
      Public-first architecture with hybrid BM25 + dense vector RRF and dynamic skill graphs.
    </text>

    <!-- Row 4: Feature Metric Badges -->
    <g transform="translate(0, 184)">
      <!-- Badge 1: 45 Tools -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="138" height="30" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="12" y="19" fill="#E2E8F0" font-size="12" font-weight="600" class="font-sans">45 Production Tools</text>
      </g>

      <!-- Badge 2: Zero Login -->
      <g transform="translate(148, 0)">
        <rect x="0" y="0" width="136" height="30" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="12" y="19" fill="#10B981" font-size="12" font-weight="600" class="font-sans">Zero-Login First</text>
      </g>

      <!-- Badge 3: Transports -->
      <g transform="translate(294, 0)">
        <rect x="0" y="0" width="144" height="30" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="12" y="19" fill="#E2E8F0" font-size="12" font-weight="500" class="font-mono">stdio | http</text>
      </g>

      <!-- Badge 4: Zero Mocks -->
      <g transform="translate(448, 0)">
        <rect x="0" y="0" width="132" height="30" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="12" y="19" fill="#38BDF8" font-size="12" font-weight="600" class="font-sans">100% Real-Time</text>
      </g>
    </g>

  </g>

  <!-- ================= RIGHT COLUMN: CLEAN ARCHITECTURE SPEC CARD ================= -->
  <g transform="translate(730, 36)">
    <!-- Card Frame -->
    <rect width="410" height="248" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    <rect width="410" height="248" rx="12" fill="url(#cardGlow)" />

    <!-- Card Header -->
    <g transform="translate(20, 22)">
      <!-- Minimal status dot -->
      <circle cx="4" cy="4" r="3.5" fill="#10B981" />
      <text x="16" y="8" fill="#E2E8F0" font-size="12" font-weight="700" letter-spacing="0.5" class="font-mono">SPECIFICATION &amp; RUNTIME</text>
      <text x="370" y="8" fill="#64748B" font-size="11" font-weight="500" text-anchor="end" class="font-mono">v0.4.5</text>
    </g>

    <line x1="20" y1="42" x2="390" y2="42" stroke="#1e293b" stroke-width="1" />

    <!-- Spec Row 1 -->
    <g transform="translate(20, 68)">
      <text x="0" y="0" fill="#64748B" font-size="12" font-weight="500" class="font-sans">Protocol Standard</text>
      <text x="370" y="0" fill="#E2E8F0" font-size="12" font-weight="600" text-anchor="end" class="font-mono">MCP Specification 2.0</text>
    </g>

    <!-- Spec Row 2 -->
    <g transform="translate(20, 100)">
      <text x="0" y="0" fill="#64748B" font-size="12" font-weight="500" class="font-sans">Access Tier</text>
      <text x="370" y="0" fill="#10B981" font-size="12" font-weight="600" text-anchor="end" class="font-mono">Public Guest · Zero Account Risk</text>
    </g>

    <!-- Spec Row 3 -->
    <g transform="translate(20, 132)">
      <text x="0" y="0" fill="#64748B" font-size="12" font-weight="500" class="font-sans">Retrieval Mode</text>
      <text x="370" y="0" fill="#38BDF8" font-size="12" font-weight="600" text-anchor="end" class="font-mono">FTS5 BM25 + Vector RRF (k=60)</text>
    </g>

    <!-- Spec Row 4 -->
    <g transform="translate(20, 164)">
      <text x="0" y="0" fill="#64748B" font-size="12" font-weight="500" class="font-sans">Live Knowledge</text>
      <text x="370" y="0" fill="#E2E8F0" font-size="12" font-weight="600" text-anchor="end" class="font-mono">Dynamic Co-occurrence Graph</text>
    </g>

    <!-- Spec Row 5 -->
    <g transform="translate(20, 196)">
      <text x="0" y="0" fill="#64748B" font-size="12" font-weight="500" class="font-sans">Quality Assurance</text>
      <text x="370" y="0" fill="#E2E8F0" font-size="12" font-weight="600" text-anchor="end" class="font-mono">119 Unit Tests · 100% Passed</text>
    </g>

    <!-- Bottom Indicator Bar -->
    <g transform="translate(20, 222)">
      <rect width="370" height="2" rx="1" fill="#1e293b" />
      <rect width="370" height="2" rx="1" fill="#0A66C2" opacity="0.6" />
    </g>
  </g>

</svg>
